name: validate

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict ./plugins/trident
      - run: claude plugin validate .

  editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared core is identical across editions
        run: |
          for f in prompts.py tools.py report.py; do
            diff editions/openai/trident_openai/$f editions/local/trident_local/$f
          done
      - run: pip install ./editions/openai ./editions/local
      - run: trident-openai x --dry-run
      - run: for r in 8 16 32 64 128; do trident-local --ram $r --dry-run; done
      - run: python -c "import ast; ast.parse(open('editions/claude-api/trident.py').read())"
